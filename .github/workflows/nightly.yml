name: Nightly (main)

# Continuous delivery from main: every code change on main rebuilds the
# installers and replaces the rolling `nightly` pre-release, so there is always
# a downloadable build of the current main branch:
#
#   https://github.com/luizjr/HIDra/releases/tag/nightly
#
# Documentation-only pushes are skipped — see the paths filter below.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "packaging/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/nightly.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  create-release:
    name: Reset the nightly release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v5

      # The nightly release is a moving target: drop the old one (and its tag)
      # so assets never accumulate across builds.
      - name: Drop the previous nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete nightly --cleanup-tag --yes || true

      - name: Create the nightly release for this commit
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.substring(0, 7);
            const body = [
              `Automatic build of \`main\` at ${sha}, replaced on every push.`,
              '',
              'This is **not a stable release** — it is whatever main looks like right now. For a version that was tagged on purpose, use the [latest release](https://github.com/luizjr/HIDra/releases/latest).',
              '',
              'Install notes are the same as a stable release: the Linux `.deb`/`.rpm` ship the udev rule, the Windows installer is unsigned (SmartScreen → *More info → Run anyway*), and the macOS app is not notarized (*right-click → Open*).',
            ].join('\n');
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: 'nightly',
              target_commitish: context.sha,
              name: `Nightly build (${sha})`,
              body,
              draft: true,
              prerelease: true,
            });
            return release.data.id;
          result-encoding: string

  build:
    name: ${{ matrix.label }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux (deb, rpm, AppImage)
            args: ""
          - os: windows-latest
            label: Windows (exe, msi)
            args: ""
          - os: macos-latest
            label: macOS (dmg, universal)
            args: "--target universal-apple-darwin"
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The bundler signs updater artifacts, so the key is needed even here.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # No latest.json: nightlies must never be offered as an update.
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  publish:
    name: Publish the nightly
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
              prerelease: true,
              make_latest: 'false',
            });
