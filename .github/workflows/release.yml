name: Release

# Publishes installers for a version tag, automatically.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The release is created, filled with the Linux/Windows/macOS bundles, and
# published — no manual step. Re-running for the same tag replaces the release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v0.1.0)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  create-release:
    name: Create the release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Building the same tag twice should replace its release, not pile new
      # assets onto the old one.
      - name: Drop any previous release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "$TAG" --yes || true

      - name: Create a draft release to upload into
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.TAG;
            const body = [
              'Installers for Linux, Windows and macOS are attached below.',
              '',
              '**Linux** — the `.deb` and `.rpm` install the udev rule for you, so just replug the device afterwards. AppImage users need the rule once: `sudo sh packaging/install-udev.sh` from a source checkout.',
              '',
              '**Windows** — the installer is unsigned: SmartScreen will ask, choose *More info → Run anyway*.',
              '',
              '**macOS** — the app is not notarized: first launch needs *right-click → Open*, or `xattr -dr com.apple.quarantine /Applications/HIDra.app`.',
              '',
              'See the [changelog](https://github.com/luizjr/HIDra/blob/main/CHANGELOG.md) for what changed.',
            ].join('\n');
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `HIDra ${tag}`,
              body,
              draft: true,
              prerelease: false,
            });
            return release.data.id;
          result-encoding: string

  build:
    name: ${{ matrix.label }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux (deb, rpm, AppImage)
            args: ""
          - os: windows-latest
            label: Windows (exe, msi)
            args: ""
          - os: macos-latest
            label: macOS (dmg, universal)
            args: "--target universal-apple-darwin"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          # The universal macOS bundle links both slices, so both targets are needed.
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts and latest.json. The app refuses any
          # update that does not verify against the matching public key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # A .deb or .rpm cannot be swapped in by the updater plugin — the package
      # manager owns those files. HIDra installs them through pkexec instead and
      # verifies them first, so their .sig has to reach the release; latest.json
      # does not mention them.
      - name: Publish the Linux package signatures
        if: matrix.os == 'ubuntu-22.04'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          shopt -s nullglob
          packages=(src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "no .deb or .rpm was produced" >&2
            exit 1
          fi
          for package in "${packages[@]}"; do
            # The bundler already signs these when createUpdaterArtifacts is on;
            # sign only if that ever stops being true.
            if [ ! -f "$package.sig" ]; then
              npx tauri signer sign \
                -f "$TAURI_SIGNING_PRIVATE_KEY" \
                -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
                "$package"
            fi
            gh release upload "$TAG" "$package.sig" --clobber
          done
        shell: bash

  publish:
    name: Publish the release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
              make_latest: 'true',
            });
